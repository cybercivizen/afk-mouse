<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Cache Warmer</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Absolute positions throughout, lifted straight off the WinForms layout:
       the numbers in app.css are the same ones Apply-Layout used to set. -->
  <div id="panel" class="compact">

    <!-- Compact and expanded both -->
    <div id="dot" class="control">&#x25CF;</div>

    <div id="big">--</div>

    <!-- Chevrons and state icons are drawn rather than typed: at 12 pixels a
         font glyph is a grey smudge, while a stroked path keeps its weight. -->
    <div id="ico-pin" class="state-ico" aria-hidden="true">
      <svg viewBox="0 0 12 12" width="12" height="12">
        <g fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1.6 2.2 H10.4" />
          <path d="M6 10.4 V5.2" />
          <path d="M3.5 7.7 L6 5.2 L8.5 7.7" />
        </g>
      </svg>
    </div>

    <!-- An almond rather than a circle: two arcs meeting at the corners read
         as an eye at this size, where an ellipse just reads as a ring. -->
    <div id="ico-eye" class="state-ico" aria-hidden="true">
      <svg viewBox="0 0 12 12" width="12" height="12">
        <g fill="none" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0.8 6 C3 1.9, 9 1.9, 11.2 6" />
          <path d="M0.8 6 C3 10.1, 9 10.1, 11.2 6" />
        </g>
        <circle cx="6" cy="6" r="1.3" stroke="none" />
        <path id="eye-gap" d="M1.3 10.5 L10.7 1.5" fill="none"
              stroke-width="2.6" stroke-linecap="round" />
        <path id="eye-slash" d="M1.3 10.5 L10.7 1.5" fill="none"
              stroke-width="1.25" stroke-linecap="round" />
      </svg>
    </div>

    <div id="chev" class="control">
      <svg viewBox="0 0 16 16" width="16" height="16">
        <path id="chev-path" fill="none" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <!-- Expanded only -->
    <div id="stat" class="panel-only control">ON</div>
    <div id="to-tray" class="panel-only control" title="Minimize to tray">
      <svg viewBox="0 0 12 12" width="12" height="12">
        <g fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 1.6 V6.8" />
          <path d="M3.5 4.3 L6 6.8 L8.5 4.3" />
          <path d="M1.6 9.8 H10.4" />
        </g>
      </svg>
    </div>
    <div id="minimize" class="panel-only control" title="Minimize">
      <svg viewBox="0 0 12 12" width="12" height="12">
        <path d="M1.6 6 H10.4" fill="none" stroke-width="1.4" stroke-linecap="round" />
      </svg>
    </div>
    <div id="close" class="panel-only control" title="Quit">&#x00D7;</div>
    <div id="cap" class="panel-only"></div>
    <div id="rule" class="panel-only" aria-hidden="true"></div>

    <!-- The shortcut list. Each action carries its own colour, so the list
         doubles as the read-out: whatever is lit is what is true right now,
         and the pause row lights the half the key would actually do. -->
    <div class="panel-only keys">
      <div class="key">Ctrl+Alt+P</div>
      <div class="key">Ctrl+Alt+T</div>
      <div class="key">Ctrl+Alt+H</div>
      <div class="key">Ctrl+Alt+Q</div>
    </div>

    <div class="panel-only acts">
      <div class="act">
        <span id="act-pause">pause</span
        ><span id="act-slash">/</span
        ><span id="act-resume">resume</span>
      </div>
      <div class="act"><span id="act-top">stay on top</span></div>
      <div class="act"><span id="act-hide">hide in shares</span></div>
      <div class="act"><span class="faint">quit</span></div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
